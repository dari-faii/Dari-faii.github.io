<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="google" content="notranslate" />
<title>Special For You</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.4/dist/sweetalert2.all.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #FFF7E6;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 400px; text-align: center; }

  /* COVER - BIAR GAK KOSONG */
  #cover {
    background: #FFF;
    border: 2px solid #FFD6DE;
    border-radius: 28px;
    padding: 36px 20px 30px;
    margin-top: 40px;
    box-shadow: 0 10px 25px rgba(255, 150, 170, 0.15);
  }
  #cover h1 { font-size: 28px; }
  #cover p { font-size: 14px; color: #888; margin: 8px 0 18px; }
  #btnLove {
    font-size: 90px; background: none; border: none; cursor: pointer;
    animation: degdegan 1s infinite;
  }
  @keyframes degdegan {
    0% { transform: scale(1); } 25% { transform: scale(1.15); }
    40% { transform: scale(1); } 60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .pencet { font-size: 14px; margin-top: 8px; }
  .hiasan { font-size: 18px; letter-spacing: 6px; margin-top: 14px; }

  /* ISI */
  #isi { display: none; }
  .kartu-foto {
    background: #FFF;
    border: 2px solid #FFD6DE;
    border-radius: 24px;
    padding: 14px 14px 18px;
    box-shadow: 0 10px 25px rgba(255, 150, 170, 0.15);
  }
  #isi img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 16px; display: block;
    transition: opacity 0.5s;
  }
  #isi.fade-out img, #isi.fade-out #ucapan { opacity: 0; }
  #ucapan { font-size: 20px; font-weight: bold; margin: 18px 10px; line-height: 1.4; transition: opacity 0.5s; }
  .btn-pink {
    background: #FFB6C1; border: 2px solid #000;
    padding: 12px 32px; border-radius: 30px;
    font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .btn-pink:disabled { opacity: 0.6; cursor: wait; }
  #tunggu { display: none; font-size: 13px; color: #888; margin-top: 10px; }
  .progress { font-size: 12px; color: #AAA; margin-top: 12px; }

  .love-kecil {
    position: fixed; font-size: 24px; pointer-events: none; z-index: 9999;
    animation: meledak 1s ease-out forwards;
  }
  @keyframes meledak {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0.5) rotate(180deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="cover">
    <div class="hiasan">✨ 💗 ✨</div>
    <h1>Special For You</h1>
    <p>ada sesuatu buat kamu</p>
    <button id="btnLove">❤️</button>
    <div class="pencet">pencet love nya</div>
    <div class="hiasan">💌 🧸 💌</div>
  </div>

  <div id="isi">
    <div class="kartu-foto">
      <img id="foto" src="" />
    </div>
    <div id="ucapan"></div>
    <button id="btnNext" class="btn-pink">Lanjut ❤️</button>
    <button id="btnKirim" class="btn-pink" style="display:none;">Kirim Pesan 💌</button>
    <div id="tunggu">tunggu bentar ya... 💌</div>
    <div class="progress" id="progress"></div>
  </div>
</div>

<audio id="musik" src="m4.mp3" loop preload="auto"></audio>

<script>
  const konten = [
    { gambar: "g1.jpg", ucapan: "loh ?udah di titik ini ternyata ?" },
    { gambar: "g4.jpg", ucapan: "katanya gbisa ? ko ini bisa ?" },
    { gambar: "g6.jpg", ucapan: "nanti juga sama kok !!" },
    { gambar: "g2.jpg", ucapan: "kamu pasti bisa lewatinya...kan kamu hebat !!" },
    { gambar: "g3.jpg", ucapan: "SEMANGAT !!!" },
  ];
  const nomorWhatsapp = "";
  let index = 0;
  const cover = document.getElementById('cover');
  const isi = document.getElementById('isi');
  const foto = document.getElementById('foto');
  const ucapanEl = document.getElementById('ucapan');
  const btnNext = document.getElementById('btnNext');
  const btnKirim = document.getElementById('btnKirim');
  const tunggu = document.getElementById('tunggu');
  const progress = document.getElementById('progress');
  const musik = document.getElementById('musik');

  function tampilkan() {
    foto.src = konten[index].gambar;
    ucapanEl.innerText = konten[index].ucapan;
    progress.innerText = (index + 1) + " / " + konten.length;
    if (index === konten.length - 1) {
      btnNext.style.display = 'none';
      btnKirim.style.display = 'inline-block';
    }
  }

  document.getElementById('btnLove').addEventListener('click', function(e) {
    musik.play().catch(() => {});
    const loves = ['❤️','💖','💗','💓','💕','🥰'];
    for (let i = 0; i < 25; i++) {
      const span = document.createElement('span');
      span.className = 'love-kecil';
      span.innerText = loves[Math.floor(Math.random() * loves.length)];
      span.style.left = e.clientX + 'px';
      span.style.top = e.clientY + 'px';
      const angle = (Math.PI * 2 * i) / 25;
      const jarak = 100 + Math.random() * 150;
      span.style.setProperty('--x', Math.cos(angle) * jarak + 'px');
      span.style.setProperty('--y', Math.sin(angle) * jarak + 'px');
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1000);
    }
    setTimeout(() => {
      cover.style.display = 'none';
      isi.style.display = 'block';
      tampilkan();
    }, 600);
  });

  btnNext.addEventListener('click', () => {
    btnNext.disabled = true;
    btnNext.innerText = "Tunggu...";
    tunggu.style.display = 'block';
    isi.classList.add('fade-out');
    setTimeout(() => {
      index++;
      tampilkan();
      isi.classList.remove('fade-out');
      btnNext.disabled = false;
      btnNext.innerText = "Lanjut ❤️";
      tunggu.style.display = 'none';
    }, 800);
  });

  btnKirim.addEventListener('click', async () => {
    const { value: pesan } = await Swal.fire({ title: "Tulis pesan", input: "textarea", confirmButtonText: "Kirim" });
    if (pesan) {
      await Swal.fire({ title: "Kirim pesannya ke wa aku ya" });
      location.assign(`https://wa.me/${nomorWhatsapp}?text=${encodeURIComponent(pesan)}`);
    } else {
      await Swal.fire({ title: "Jangan dikosongin ya :)" });
    }
  });
</script>
</body>
</html>
