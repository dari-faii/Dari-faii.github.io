<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Special For You</title>

    <link rel="stylesheet" href="https://files.dariku.my.id/dks205/s.css" />
  </head>
  <body">
    <div class="preload">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="container">
      <div class="btn-c">
        <button class="btn-start show">Klik Disini</button>
        <button class="btn-next">Lanjut</button>
        <button class="btn-message">Kirim Pesan</button>
      </div>
    </div>

    <script src="https://files.dariku.my.id/dks205/s.js"></script>
    <script>
      // Teks pada cover
      textOpening = "bangun nda uda siang XD";

      // File musik
      musik = "m3.mp3";

      // [OPSIONAL] isi background jika tidak ingin menggunakan bakground bawaan
      background = "g8.jpg";

      // Jika menggunakan 1 gambar, isi pada cover1 saja
      // Atau isi semuanya jika ingin menggunakan 4 gambar
      // Note: hanya bisa menggunakan 1 gambar atau 4 sekaligus
      cover1 = "";
      cover2 = "";
      cover3 = "";
      cover4 = "";

      // Jika ingin menambahkan ucapan ikuti seperti contoh
      konten = [
        {
          gambar: "g1.jpg",
          ucapan: "pagi nda mangat ya buat hari senin dan seterusnya ^^",
        },
        {
          gambar: "g3.jpg",
          ucapan: "jadi gini nda",
        },
        {
          gambar: "g5.jpg",
          ucapan: "untuk kamu tetap semangat dalam keadaan apapun itu .maaf cuma bisa nyemangatin dari jauh xixi. aku harap hari hari kamu jauh lebih baik .kalo capek jangan lupa istirahat ya. kalo butuh tempat cerita ,tempat berkeluh kesah. aku disini ,yaa walaupun jauh xixi ^^ ",
        },
      ];

      // [OPSIONAL] Diawali 62
      nomorWhatsapp = "";

      var swalo = Swal.mixin({ allowOutsideClick: false, reverseButtons: true });
      async function kirimPesan() {
        klikA.play();
        var { value: pesan } = await swalo.fire({ title: "Tulis pesan", input: "textarea", confirmButtonText: "Kirim" });
        klikA.play();
        if (pesan) {
          await swalo.fire({ title: "Kirim pesannya ke wa aku ya" });
          location.assign(`https://wa.me/${nomorWhatsapp}?text=${pesan}`);
        } else {
          await swalo.fire({ title: "Jangan dikosongin ya :)" });
          kirimPesan();
        }
      }

      isKlikAudio = 1;
      DekaTutorial(konten, musik, textOpening, background, cover1, cover2, cover3, cover4, kirimPesan, isKlikAudio);
    </script>
  </body>
